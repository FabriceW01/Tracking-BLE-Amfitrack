<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Printhead — Druckansicht</title>
<style>
  :root{
    --bg:#12151a; --panel:#1a1f27; --panel2:#212832; --line:#2c3542;
    --fg:#e6ebf2; --dim:#96a3b4; --accent:#4a9eff; --ok:#3ec97a;
    --warn:#f0b429; --bad:#ff5c5c; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  a{color:var(--accent);text-decoration:none}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);
         background:var(--panel2);color:var(--fg);padding:7px 13px;border-radius:6px}

  header{display:flex;align-items:center;gap:14px;padding:10px 16px;
         background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
  header .spacer{flex:1}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
  .dot.on{background:var(--ok)} .dot.off{background:#55606f}
  .pill{font-size:12px;color:var(--dim);display:flex;align-items:center}

  /* Hauptfokus: die Druckpreview bekommt den grossen, breiten Teil des
     Bildschirms; Position und Deckungszahl stehen als schmale Spalte
     daneben. Auf schmalen Fenstern faellt die Spalte darunter. */
  main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;
       padding:12px;align-items:start}
  @media(max-width:900px){main{grid-template-columns:1fr}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;
         margin-bottom:12px}
  .panel > h2{font-size:12px;text-transform:uppercase;letter-spacing:.7px;
              color:var(--dim);margin:0;padding:10px 14px;border-bottom:1px solid var(--line)}
  .panel .body{padding:14px}

  /* Deckungs-Panel: bewusst hoch genug, dass die Leinwand wirklich Platz
     bekommt -- "Hauptfokus" heisst hier auch, dass sie nicht in einer
     schmalen Seitenspalte klein bleibt wie auf der Steuerseite. */
  #cov-panel .body{min-height:min(78vh,900px);display:flex;
                   align-items:center;justify-content:center}
  .imgwrap{background:#fff;border-radius:6px;padding:6px;min-height:90px;
           display:flex;align-items:center;justify-content:center;width:100%}
  .imgwrap.empty{background:#0e1116;color:var(--dim);font-size:13px;min-height:90px}
  #cov{max-width:100%;max-height:76vh;display:block;image-rendering:pixelated;
       background:#fff;cursor:zoom-in}
  #cov-stack{position:relative;display:block;line-height:0;max-width:100%}
  #cov-ov{position:absolute;left:0;top:0;width:100%;height:100%;
          pointer-events:none}
  #cov-wrap.zoom{max-height:80vh;overflow:auto;align-items:flex-start}
  #cov-wrap.zoom #cov{max-width:none;max-height:none;cursor:zoom-out}
  #cov-wrap.zoom #cov-stack{max-width:none}
  #cov-note{color:var(--dim);font-size:12px;margin-top:8px;text-align:center}
  #cov-note.warn{color:#e0a33e}

  /* Deckungszahl: gross, weil sie auf einen Blick von Weitem lesbar sein
     soll -- der Punkt, weshalb "Prozent zur besseren Uebersicht" ueberhaupt
     verlangt war, statt nur die Rohzahl "7483 / 9939" stehen zu lassen. */
  #vw-pct{font:700 46px/1.1 var(--mono);text-align:center;color:var(--ok)}
  #vw-pct.stale{color:#5c6672}
  #vw-count{text-align:center;color:var(--dim);font-size:13px;margin-top:6px}
  .bar{height:8px;background:#0e1116;border-radius:4px;overflow:hidden;margin-top:12px}
  .bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}

  .pos{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
  .pos div{background:var(--panel);padding:8px 10px}
  .pos .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
  .pos .v{font:600 15px/1.3 var(--mono);margin-top:2px}
  .pos .v.stale{color:#5c6672}
  /* Ampel fuer "v mm/s" -- nach .stale, damit ein veraltetes Feld immer
     grau gewinnt, nicht die zuletzt bekannte Farbe. Ausserdem wird
     speed-* beim Veralten explizit entfernt (siehe setPos/staleTimer
     unten), das hier ist nur die zweite Absicherung. */
  .pos .v.speed-good{color:var(--ok)}
  .pos .v.speed-warn{color:var(--warn)}
  .pos .v.speed-bad{color:var(--bad)}
</style>
</head>
<body>

<header>
  <h1>Printhead — Druckansicht</h1>
  <span class="pill"><span id="d-ws" class="dot off"></span>Server</span>
  <span class="pill"><span id="d-sensor" class="dot off"></span>Sensor</span>
  <span class="pill"><span id="d-action" class="dot off"></span>Aktion</span>
  <span class="spacer"></span>
  <a href="/" id="back-link">← Steuerung</a>
</header>

<main>
  <!-- ==================================================== Druckpreview -->
  <div class="panel" id="cov-panel">
    <h2>Druckpreview (live)</h2>
    <div class="body">
      <div style="width:100%">
        <div class="imgwrap empty" id="cov-wrap">noch kein Durchgang</div>
        <div id="cov-note"></div>
      </div>
    </div>
  </div>

  <!-- ==================================================== Seitenspalte -->
  <div>
    <div class="panel">
      <h2>Deckung</h2>
      <div class="body">
        <div id="vw-pct" class="stale">–</div>
        <div id="vw-count">– / – Pixel</div>
        <div class="bar"><i id="vw-bar"></i></div>
      </div>
    </div>

    <div class="panel">
      <h2>Position</h2>
      <div class="pos">
        <div><div class="k">x mm</div><div class="v stale" id="p-x">–</div></div>
        <div><div class="k">y mm</div><div class="v stale" id="p-y">–</div></div>
        <div><div class="k">z mm</div><div class="v stale" id="p-z">–</div></div>
        <div><div class="k">Seite u</div><div class="v stale" id="p-u">–</div></div>
        <div><div class="k">Seite v</div><div class="v stale" id="p-v">–</div></div>
        <div><div class="k">Spalte</div><div class="v stale" id="p-col">–</div></div>
        <div><div class="k">Zeile</div><div class="v stale" id="p-row">–</div></div>
        <div><div class="k">Gier °</div><div class="v stale" id="p-yaw">–</div></div>
        <div><div class="k">v mm/s</div><div class="v stale" id="p-spd">–</div></div>
        <div><div class="k">Quelle</div><div class="v stale" id="p-src">–</div></div>
      </div>
    </div>
  </div>
</main>

<script src="/coverage_view.js"></script>
<script>
const $ = id => document.getElementById(id);
/* Muss zu printhead.geometry.NOZZLE_PITCH_MM passen -- nur zur Anzeige der
   Zeile im Leerlauf, wo --pos-json selbst kein row liefert. Dieselbe
   Herleitung wie in index.html, absichtlich dort nicht geteilt: eine
   einzelne Konstante duplizieren birgt kein Drift-Risiko wie die
   Balken-/Skalierungsformeln in coverage_view.js. */
const NOZZLE_PITCH_MM = 13.2 / 152;
const F = (x, n) => (x === null || x === undefined) ? "–" : Number(x).toFixed(n);

let staleTimer = null;

function setPos(o, quelle){
  const set = (id, val) => {
    const el = $(id); el.textContent = val; el.classList.remove("stale");
  };
  set("p-x", F(o.x, 2)); set("p-y", F(o.y, 2)); set("p-z", F(o.z, 2));
  const u = (o.page_u !== undefined) ? o.page_u : o.u;
  const v = (o.page_v !== undefined) ? o.page_v : o.v;
  set("p-u", F(u, 2)); set("p-v", F(v, 2));
  set("p-col", o.col !== undefined ? o.col : "–");
  const row = (o.row !== undefined) ? o.row
            : (v === undefined || v === null ? undefined
               : Math.round(v / NOZZLE_PITCH_MM));
  set("p-row", row !== undefined ? row : "–");
  set("p-yaw", F(o.yaw_deg, 2));
  set("p-spd", o.speed_mm_s === undefined ? "–" : F(o.speed_mm_s, 1));
  /* Ampel: covSpeedClass() kennt die Schwellen dieses Durchgangs (kommen
     mit coverage_start, siehe coverage_view.js) und liefert "off" ohne
     Durchgang/Schwellen -- dann traegt p-spd keine speed-*-Klasse. */
  const spdKlasse = covSpeedClass(o.speed_mm_s);
  $("p-spd").classList.remove("speed-good", "speed-warn", "speed-bad");
  if (spdKlasse !== "off") $("p-spd").classList.add("speed-" + spdKlasse);
  set("p-src", quelle);

  if (o.covered !== undefined && o.total){
    const pct = 100 * o.covered / o.total;
    $("vw-pct").textContent = pct.toFixed(1) + " %";
    $("vw-pct").classList.remove("stale");
    $("vw-count").textContent = o.covered + " / " + o.total + " Pixel";
    $("vw-bar").style.width = pct.toFixed(1) + "%";
  }

  clearTimeout(staleTimer);
  staleTimer = setTimeout(() => {
    document.querySelectorAll(".pos .v").forEach(e => e.classList.add("stale"));
    /* Ampel-Farbe darf ein veraltetes Feld nicht ueberleben -- sonst
       zeigte "v mm/s" nach Verbindungsabbruch oder Durchgangsende
       weiterhin "zu schnell" (rot), obwohl gar keine aktuelle Messung
       mehr dahintersteht. */
    $("p-spd").classList.remove("speed-good", "speed-warn", "speed-bad");
    $("vw-pct").classList.add("stale");
    $("p-src").textContent = "veraltet";
  }, 2000);
}

/* ------------------------------------------------------------ WebSocket
   Derselbe Endpunkt wie die Steuerseite: der Hub sendet an ALLE
   verbundenen Clients dasselbe, ohne Extra-Serverlogik fuer ein zweites
   Fenster -- siehe server.py's Hub.broadcast. Ein `replay`-Flag auf einem
   coverage_start (siehe Hub.register) sagt, ob dieses Fenster mitten in
   einem bereits laufenden Durchgang verbunden hat; dann fehlen fruehere
   Zellen auf DIESER Leinwand fuer immer (der Hub puffert sie nicht), was
   hier auch so gesagt wird statt es unbemerkt zu lassen. */
let ws = null;
function connect(){
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://")
                     + location.host + "/ws");
  ws.onopen = () => { $("d-ws").className = "dot on"; };
  ws.onclose = () => {
    $("d-ws").className = "dot off";
    $("d-sensor").className = "dot off";
    if (covActive && !covStale){
      covStale = true;
      covNote("unvollständig — Verbindung war unterbrochen; "
              + "maßgeblich ist die Zahl oben nach dem Durchgang", true);
    }
    setTimeout(connect, 1500);
  };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "position") setPos(m, "Sensor");
    else if (m.type === "coverage_event"){
      if (m.event === "coverage_start"){
        covStart(m.width, m.height, m.speed_warn_mm_s, m.speed_stop_mm_s);
        if (m.replay){
          covNote("Ansicht während eines laufenden Durchgangs geöffnet — "
                  + "vorher gedruckte Zellen fehlen auf diesem Bild; die "
                  + "Zahl oben ist trotzdem live.", true);
        }
      }
      else if (m.event === "coverage"){
        setPos(m, "Druck");
        covCells(m.new_cells);
        covHead(m.bar);
      }
      else if (m.event === "coverage_done"){
        covActive = false;
        covHead(null);
      }
    }
    else if (m.type === "status"){
      $("d-action").className = "dot " + (m.action_running ? "on" : "off");
      $("d-sensor").className = "dot " + (m.sensor_running ? "on" : "off");
    }
  };
}
connect();

/* -------------------------------------------------------- Zurück-Button
   Diese Seite wird von der Steuerseite immer per target="_blank" in einem
   NEUEN Tab geöffnet (siehe index.html) -- der ursprüngliche Tab mit der
   Steuerseite bleibt dabei unverändert im Hintergrund offen, samt allem,
   was dort eingestellt war. Ein normaler href="/"-Link würde stattdessen
   DIESEN Tab auf "/" umlenken: das lädt eine FRISCHE Steuerseite mit
   Standardeinstellungen -- sieht für den Nutzer wie ein zweiter, neuer
   Tab mit verlorenen Einstellungen aus, obwohl der echte Original-Tab die
   ganze Zeit unangetastet daneben lag. Schließt man den Druckansicht-Tab
   stattdessen einfach, landet man automatisch wieder auf dem
   Original-Tab.

   window.close() darf ein Tab schließen, den ein Skript geöffnet hat --
   das gilt für einen per target="_blank" angeklickten Link genauso wie
   für einen echten window.open()-Aufruf, unabhängig von rel="noopener"
   (das nullt nur window.opener, nicht die "von einem Skript geöffnet"-
   Markierung). Verweigert ein Browser das trotzdem (z.B. weil der Tab
   zwischenzeitlich woanders hin navigiert wurde), bleibt window.close()
   wirkungslos, statt einen Fehler zu werfen -- deshalb der Fallback auf
   die alte Navigation, damit der Button nie komplett tot wirkt. */
$("back-link").addEventListener("click", ev => {
  ev.preventDefault();
  window.close();
  setTimeout(() => { location.href = "/"; }, 300);
});
</script>
</body>
</html>
